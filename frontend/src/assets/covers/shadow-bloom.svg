<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="Portada de Shadow Bloom">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b0a24"/>
      <stop offset="0.6" stop-color="#701a55"/>
      <stop offset="1" stop-color="#0b1020"/>
