services:
  - type: web
    name: arkane-zone
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn arkane_zone.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    # Readiness real: falla si la base de datos no responde (AZ-S2-BE-09).
    healthCheckPath: /api/v1/health/ready/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        sync: false          # se configura manualmente en el panel de Render
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false          # se configura manualmente en el panel de Render
      - key: ALLOWED_HOSTS
        sync: false          # se configura manualmente (ej: arkane-zone.onrender.com)
      - key: RENDER_EXTERNAL_HOSTNAME
        fromService:
          type: web
          name: arkane-zone
          property: host
      # Orígenes del frontend si se despliega en otro dominio y consume la API
      # directamente (sin proxy /api). Ej: https://arkane-zone.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
