name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancela ejecuciones obsoletas de la misma rama / PR.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (SQLite, cobertura, lint y chequeos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-test-secret-not-for-production
      DEBUG: "False"
      DATABASE_URL: sqlite:///db.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Dockerfile: python:3.12.9-slim; render.yaml: PYTHON_VERSION=3.12.0.
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Ruff (solo check, sin formateo)
        run: .venv/bin/ruff check .

      - name: Pruebas con cobertura
        run: |
          .venv/bin/python -m pytest -c pytest.ini -q \
            --cov --cov-report=xml:coverage.xml --cov-report=html:htmlcov

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: |
            backend/coverage.xml
            backend/htmlcov/
          if-no-files-found: warn
          retention-days: 7

      - name: Migraciones pendientes
        run: .venv/bin/python manage.py makemigrations --check --dry-run

  tests-postgres:
    name: tests-postgres (suite completa contra PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arkane_ci
          POSTGRES_USER: arkane
          POSTGRES_PASSWORD: arkane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkane -d arkane_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-test-secret-not-for-production
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://arkane:arkane@localhost:5432/arkane_ci
      TEST_DATABASE_URL: postgres://arkane:arkane@localhost:5432/arkane_ci
      SECURE_SSL_REDIRECT: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Generar SECRET_KEY de CI
        id: secret
        run: |
          SECRET="$('.venv/bin/python' -c 'import secrets; print(secrets.token_hex(32))')"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Endurecimiento de producción
        # check --deploy sale limpio con estas variables; si aparece alguna
        # advertencia, su corrección corresponde a otro issue (no se oculta).
        env:
          SECRET_KEY: ${{ steps.secret.outputs.secret }}
        run: .venv/bin/python manage.py check --deploy --fail-level WARNING

      - name: Suite completa en PostgreSQL
        # Sin marcadores especiales: select_for_update bloquea de verdad aquí.
        run: .venv/bin/python -m pytest -c pytest.ini -q
