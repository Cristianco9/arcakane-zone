# Override de producción. Se combina con compose.yaml:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# Requisitos antes de usarlo:
#   - DJANGO_DEBUG=False en .env
#   - secretos fuertes y reales en .env (o Docker secrets, ver README)
#   - DJANGO_ALLOWED_HOSTS con el dominio público
#   - TLS terminado en un proxy inverso externo que envía X-Forwarded-Proto;
#     SECURE_SSL_REDIRECT permanece activo y el healthcheck interno envía
#     esa cabecera al consultar /api/v1/health/ready/

services:
  db:
    restart: ${PROD_RESTART_POLICY:?PROD_RESTART_POLICY is required}

  backend:
    restart: ${PROD_RESTART_POLICY:?PROD_RESTART_POLICY is required}
    command:
      [
        "gunicorn",
        "arkane_zone.wsgi:application",
        "--bind",
        "0.0.0.0:${BACKEND_PORT:-8000}",
        "--workers",
        "${BACKEND_WORKERS:?BACKEND_WORKERS is required}",
        "--timeout",
        "${BACKEND_TIMEOUT:?BACKEND_TIMEOUT is required}",
        "--access-logfile",
        "-",
        "--error-logfile",
        "-",
      ]
    environment:
      DEBUG: "False"

  frontend:
    restart: ${PROD_RESTART_POLICY:?PROD_RESTART_POLICY is required}
    build:
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    environment:
      BACKEND_HOST: ${BACKEND_HOST:?BACKEND_HOST is required}
      BACKEND_PORT: ${BACKEND_PORT:?BACKEND_PORT is required}
      FRONTEND_PORT: ${FRONTEND_PORT:?FRONTEND_PORT is required}

  pgadmin:
    restart: ${PROD_RESTART_POLICY:?PROD_RESTART_POLICY is required}
    environment:
      # En producción pgAdmin exige una master password adicional.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
